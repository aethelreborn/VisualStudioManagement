# All user-visible text (spec 3.3). MiniMessage formatting, no hard-coded strings in Java.
#
# Placeholders in use: <player>, <target>, <staff>, <reason>, <duration>, <expires>,
# <id>, <type>, <appeal>, <server>, <ip_masked>, plus per-message extras.
#
# Player supplied values are always inserted unparsed, so a reason containing
# <click:run_command:...> renders as plain text.

# ----------------------------------------------------------------- generic
no-permission: "<red>You do not have permission to use this command."
staff-only: "<red>This command is for staff members only."
player-only-command: "<red>Only a player can run this command."
player-not-found: "<red>Player not found."
not-staff: "<red>That player is not on the staff whitelist."
action-cancelled: "<gray>Action cancelled."
action-failed: "<red>The action could not be completed."
usage: "<gray>Usage: <command>"
invalid-coordinates: "<red>Those coordinates are not valid. Use numbers or ~ for relative values."
world-not-found: "<red>No such world: <white><world></white>."
world-blacklisted: "<red>Teleporting into <white><world></white> is disabled."
no-rank-change: "<red>That rank is already the highest or lowest in the ladder."
unknown-rank: "<red>Unknown rank: <white><rank></white>."

