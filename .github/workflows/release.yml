name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PAPER_SHA256: bf1dcf627364f8a631ab15250d240eb5a8e89faaac523b391e1c61367fce9ff1
  PAPER_URL: https://fill-data.papermc.io/v1/objects/bf1dcf627364f8a631ab15250d240eb5a8e89faaac523b391e1c61367fce9ff1/paper-26.2-133.jar

jobs:
  release:
    name: Build, smoke-test on a real Paper server, publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace build

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Paper 26.2 server
        run: |
          set -euo pipefail
          mkdir -p /tmp/paper && cd /tmp/paper
          curl -fsSL -o paper.jar "$PAPER_URL"
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -

      - name: "Smoke test: boot Paper with the plugin and drive the commands"
        run: |
          set -euo pipefail
          cd /tmp/paper
          JAR=$(ls "$GITHUB_WORKSPACE"/build/libs/VisualStudioManagement-*.jar | grep -v sources | head -1)
          mkdir -p plugins
          cp "$JAR" plugins/
          echo "eula=true" > eula.txt
          printf '%s\n' \
            'online-mode=false' \
            'level-type=minecraft\:flat' \
            'level-name=world' \
            'spawn-protection=0' \
            'view-distance=4' \
            'simulation-distance=4' \
            'max-players=5' \
            'enable-command-block=false' \
            'enable-status=false' \
            'sync-chunk-writes=false' \
            > server.properties

          # The server prints "Done (" when it is ready; send the command script after that.
          mkfifo console_in
          (
            sleep 70
            echo "vsm"
            sleep 3
            echo "staff ranks"
            sleep 3
            echo "checkban Steve"
            sleep 3
            echo "history Steve"
            sleep 3
            echo "vsm audit verify"
            sleep 3
            echo "vsm debug"
            sleep 3
            echo "vsm reload"
            sleep 3
            echo "vsm about"
            sleep 4
            echo "stop"
          ) > console_in &

          set +e
          timeout 300 java -Xms512M -Xmx1G -XX:+UseG1GC -jar paper.jar --nogui < console_in > server.log 2>&1
          code=$?
          set -e
          echo "--- server exit code: $code"
          if [ $code -ne 0 ]; then
            echo "::error::Paper exited with code $code"
            cat server.log
            exit 1
          fi

      - name: "Smoke test: assert a clean, functional startup"
        run: |
          set -euo pipefail
          cd /tmp/paper

          echo "=== plugin lifecycle"
          grep -E "VisualStudioManagement" server.log | head -20 || true

          failed=0
          for pattern in "Could not load" "Error occurred while enabling" "Failed to load plugin" \
                         "Unable to load plugin" "Exception in thread \"main\"" "Could not enable plugin" \
                         "NoClassDefFoundError" "ClassNotFoundException"; do
            if grep -qF "$pattern" server.log; then
              echo "::error::Failure marker in the server log: $pattern"
              grep -nF "$pattern" server.log | head -10
              failed=1
            fi
          done
          if grep -qE "^\[[0-9:]+ (ERROR|WARN)\]:.*Exception" server.log; then
            echo "::error::An exception was logged"
            grep -nE "^\[[0-9:]+ (ERROR|WARN)\]:.*Exception" server.log | head -10
            failed=1
          fi
          [ $failed -eq 0 ] || exit 1

          grep -q "Enabling VisualStudioManagement" server.log || {
            echo "::error::The plugin was never enabled"; exit 1; }
          grep -qE "Enabled in .* using SQLite storage" server.log || {
            echo "::error::The plugin did not report a clean enable"; exit 1; }
          grep -q "Done (" server.log || { echo "::error::Server never finished starting"; exit 1; }

          echo "=== generated configuration"
          DATA=plugins/VisualStudioManagement
          for file in config.yml messages.yml ranks.yml templates.yml reasons.yml automod.yml permissions.yml; do
            [ -s "$DATA/$file" ] || { echo "::error::$DATA/$file was not written"; exit 1; }
          done
          [ -s "$DATA/database.db" ] || { echo "::error::the SQLite database was not created"; exit 1; }
          ls -la "$DATA"

          echo "=== command output"
          grep -E "Visual Studio Management v|Unknown command|wrong number of arguments|is not a valid" server.log \
            | head -20 || true
          if grep -qE "Unknown command|is not a valid" server.log; then
            echo "::error::A registered command was rejected"
            grep -nE "Unknown command|is not a valid" server.log | head -10
            exit 1
          fi
          grep -q "Visual Studio Management v" server.log || {
            echo "::error::The /vsm command produced no output"; exit 1; }
          grep -q "audit chain verified" server.log || {
            echo "::error::The audit chain verification produced no output"; exit 1; }

          echo "Smoke test passed."

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/VisualStudioManagement-*.jar | grep -v sources | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "Visual Studio Management $TAG" \
              --generate-notes
          fi
          gh release view "$TAG" --json url --jq .url